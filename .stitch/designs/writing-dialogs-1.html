## 核心观察
1. **本地优先与隐私安全**：创作者不再愿意将未完成的灵感和长文裸露在云端。
2. **向量化检索的日常化**：每一篇导入的草稿都应当自动建立本地嵌入（Embedding），使历史素材能够随时通过语义唤醒。
3. **极简主义的工作流**：消除不必要的浮窗与动画，将专注力归还给文字本身。

&gt; “心流的本质是降低摩擦力。当界面隐形，思考才能真正发生。”</textarea>
