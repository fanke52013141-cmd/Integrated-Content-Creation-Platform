<body class="bg-[#f7f8fa] text-[#17212f] font-body-md min-h-screen flex items-center justify-center p-space-xl">
<div class="fixed inset-0 bg-[#101c2d]/20 backdrop-blur-xs flex items-center justify-center z-50 p-gutter">
<div class="bg-[#ffffff] w-full max-w-[800px] rounded-lg border border-[#e7ebf0] shadow-[0_4px_16px_rgba(23,33,47,0.06)] flex flex-col max-h-[921px] overflow-hidden">
<div class="flex items-center justify-between px-space-xl py-space-lg border-b border-[#e7ebf0]">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">配置热点筛选</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">当前规则将应用于目标账号底层 Prompt 中</p>
</div>
<button class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-all duration-200 cursor-pointer">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="p-space-xl overflow-y-auto space-y-space-xl flex-1">
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-xl">
<div class="space-y-space-sm">
<label class="block font-label-md text-label-md text-on-surface">目标账号 (Target Account)</label>
<div class="relative">
<select class="w-full h-[40px] px-space-md bg-white border border-[#e7ebf0] rounded-lg font-body-md text-on-surface focus:outline-none focus:border-[#2563eb] transition-all duration-200 appearance-none">

<option>@ai_insight · 深度观察副号</option>
<option>@dev_weekly · 独立开发者专栏</option>
</select>
<div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</div>
</div>
</div>
<div class="space-y-space-sm">
<label class="block font-label-md text-label-md text-on-surface">AI 模型引擎 (Engine)</label>
<div class="relative">
<select class="w-full h-[40px] px-space-md bg-white border border-[#e7ebf0] rounded-lg font-body-md text-on-surface focus:outline-none focus:border-[#2563eb] transition-all duration-200 appearance-none">
<option>Claude 3.5 Sonnet (默认高性能)</option>
<option>GPT-4o (高并发推理模式)</option>
<option>DeepSeek V3 (极速轻量模式)</option>
</select>
<div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</div>
</div>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-xl">
<div class="space-y-space-sm">
<label class="block font-label-md text-label-md text-on-surface">单源采集 Top N</label>
<div class="relative">
<input class="w-full h-[40px] px-space-md bg-white border border-[#e7ebf0] rounded-lg font-body-md text-on-surface focus:outline-none focus:border-[#2563eb] transition-all duration-200" type="number" value="50"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-body-sm text-on-surface-variant">条/源</div>
</div>
</div>
<div class="space-y-space-sm">
<label class="block font-label-md text-label-md text-on-surface">并发抓取线程数</label>
<div class="relative">
<input class="w-full h-[40px] px-space-md bg-white border border-[#e7ebf0] rounded-lg font-body-md text-on-surface focus:outline-none focus:border-[#2563eb] transition-all duration-200" type="number" value="8"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-body-sm text-on-surface-variant">线程</div>
</div>
</div>
</div>
<div class="space-y-space-sm">
<label class="block font-label-md text-label-md text-on-surface">活动过滤源选择 (Source Feeds)</label>
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-space-md">
<label class="flex items-center space-x-space-sm p-space-md bg-[#f9f9ff] border border-[#e7ebf0] rounded-lg cursor-pointer hover:border-[#2563eb] transition-all duration-200">
<input checked="" class="w-4 h-4 text-[#2563eb] border-[#e7ebf0] rounded focus:ring-0" type="checkbox"/>
<span class="font-body-md text-on-surface">全网实时热搜</span>
</label>
<label class="flex items-center space-x-space-sm p-space-md bg-[#f9f9ff] border border-[#e7ebf0] rounded-lg cursor-pointer hover:border-[#2563eb] transition-all duration-200">
<input checked="" class="w-4 h-4 text-[#2563eb] border-[#e7ebf0] rounded focus:ring-0" type="checkbox"/>
<span class="font-body-md text-on-surface">科技垂直社群流</span>
</label>
<label class="flex items-center space-x-space-sm p-space-md bg-[#f9f9ff] border border-[#e7ebf0] rounded-lg cursor-pointer hover:border-[#2563eb] transition-all duration-200">
<input checked="" class="w-4 h-4 text-[#2563eb] border-[#e7ebf0] rounded focus:ring-0" type="checkbox"/>
<span class="font-body-md text-on-surface">财经商业快讯</span>
</label>
<label class="flex items-center space-x-space-sm p-space-md bg-[#f9f9ff] border border-[#e7ebf0] rounded-lg cursor-pointer hover:border-[#2563eb] transition-all duration-200">
<input class="w-4 h-4 text-[#2563eb] border-[#e7ebf0] rounded focus:ring-0" type="checkbox"/>

</label>
<label class="flex items-center space-x-space-sm p-space-md bg-[#f9f9ff] border border-[#e7ebf0] rounded-lg cursor-pointer hover:border-[#2563eb] transition-all duration-200">
<input checked="" class="w-4 h-4 text-[#2563eb] border-[#e7ebf0] rounded focus:ring-0" type="checkbox"/>
<span class="font-body-md text-on-surface">开源社区动态</span>
</label>
<label class="flex items-center space-x-space-sm p-space-md bg-[#f9f9ff] border border-[#e7ebf0] rounded-lg cursor-pointer hover:border-[#2563eb] transition-all duration-200">
<input class="w-4 h-4 text-[#2563eb] border-[#e7ebf0] rounded focus:ring-0" type="checkbox"/>
<span class="font-body-md text-on-surface">独立开发者日记</span>
</label>
</div>
</div>
<div class="space-y-space-sm">

</div>
</div>
</div>
