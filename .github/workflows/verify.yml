name: Verify desktop workflow
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-workflow.mjs
      - run: node scripts/smoke-publishing.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workflow-evidence
          path: artifacts/
