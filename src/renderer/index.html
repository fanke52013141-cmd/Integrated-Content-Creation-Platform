<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: moliu-asset:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="color-scheme" content="light" />
    <title>心流</title>
    <script src="/theme-init.js"></script>
    <style>
      /* 启动兜底：应用挂载成功后 #root 不再为空，本节点自动消失。
         若脚本因任何原因未执行（资源加载失败 / 解析异常），用户看到的
         是一句可读的说明，而不是纯白屏。纯 CSS 实现，不违反 CSP。 */
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        z-index: 9999;
      }
      /* #root 始终为空说明应用从未挂载 → 显示兜底 */
      #root:empty + #boot-fallback { display: grid; }
      .boot-fallback-card { text-align: center; max-width: 380px; padding: 0 24px; }
      .boot-fallback-mark {
        width: 44px; height: 44px; margin: 0 auto 18px;
        border-radius: 12px; display: grid; place-items: center;
        background: #1d1d1f; color: #fff; font-size: 20px; font-weight: 600;
      }
      .boot-fallback-title { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
      .boot-fallback-desc { margin: 0; font-size: 13px; line-height: 1.6; color: #56565c; }
      .boot-fallback-hint {
        margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: #6e6e73;
        padding-top: 14px; border-top: 1px solid #e8e8ed;
      }
      .boot-fallback-hint code {
        font-family: 'SF Mono', ui-monospace, Consolas, monospace;
        font-size: 11.5px; background: rgba(0, 0, 0, 0.05);
        padding: 1px 5px; border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" role="alert" aria-live="assertive">
      <div class="boot-fallback-card">
        <div class="boot-fallback-mark" aria-hidden="true">流</div>
        <p class="boot-fallback-title">界面没有正常加载</p>
        <p class="boot-fallback-desc">本地资源读取失败，应用没能启动。</p>
        <p class="boot-fallback-hint">
          请关闭应用后重新打开；若仍然失败，说明安装文件可能不完整，
          请重新安装最新版；问题依旧可通过项目的 GitHub Issues 联系我们。
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
